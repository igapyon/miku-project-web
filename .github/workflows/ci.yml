name: Web build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run verify

      - name: Upload verified Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miku-project-web
          path: |
            index.html
            miku-project.html
            mikuproject.html
